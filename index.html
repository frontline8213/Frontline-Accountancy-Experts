<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontline Accountancy Experts | Accountants in Nottingham</title>
    <style>
        :root {
            --primary-color: #101c36;
            --secondary-color: #1e3a8a;
            --accent-color: #2563eb;
            --text-color: #334155;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --max-width: 1100px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            background-color: var(--white);
        }

        /* Header & Navigation */
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            max-height: 45px;
            width: auto;
        }

        .logo-fallback {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .logo-fallback span {
            color: var(--accent-color);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        nav a.btn-nav-cta {
            background-color: var(--accent-color);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
        }

        nav a.btn-nav-cta:hover {
            background-color: var(--secondary-color);
        }

        /* Hero Section */
        .hero {
            padding: 80px 20px;
            background-color: var(--white);
            text-align: left;
        }

        .hero-container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .hero-sub {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 46px;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .hero p {
            font-size: 18px;
            color: #475569;
            margin-bottom: 35px;
            max-width: 700px;
        }

        .hero-btns {
            display: flex;
            gap: 15px;
        }

        .btn-main {
            display: inline-block;
            text-decoration: none;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background-color: var(--secondary-color);
        }

        .btn-outline {
            display: inline-block;
            text-decoration: none;
            border: 1px solid #cbd5e1;
            color: var(--primary-color);
            padding: 14px 28px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-outline:hover {
            background-color: var(--light-bg);
        }

        /* Section Layouts */
        .section {
            padding: 80px 20px;
            border-top: 1px solid var(--border-color);
        }

        .section-bg {
            background-color: var(--light-bg);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .section-title {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .section-desc {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 45px;
        }

        /* Services Grid */
        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background-color: var(--white);
            padding: 30px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .service-card h3 {
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .service-card p {
            font-size: 15px;
            color: #475569;
        }

        /* Why Choose Us Section */
        .grid-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .feature-item h3 {
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .feature-item p {
            font-size: 15px;
            color: #475569;
        }

        /* Software Strip */
        .software-strip {
            background-color: var(--white);
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .software-text {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .software-flex {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
            font-weight: 700;
            font-size: 20px;
            color: #94a3b8;
        }

        /* Chat Section Banner */
        .chat-banner {
            padding: 80px 20px;
            text-align: center;
            background-color: var(--white);
            border-top: 1px solid var(--border-color);
        }

        .chat-banner h2 {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .chat-banner p {
            font-size: 16px;
            color: #475569;
            margin-bottom: 30px;
        }

        /* Footer */
        footer {
            background-color: var(--light-bg);
            padding: 60px 20px 30px;
            border-top: 1px solid var(--border-color);
        }

        .footer-grid {
            max-width: var(--max-width);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .footer-col h4 {
            color: var(--primary-color);
            font-size: 15px;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-col p, .footer-col a {
            font-size: 14px;
            color: #475569;
            text-decoration: none;
            margin-bottom: 10px;
            display: block;
        }

        .footer-col a:hover {
            color: var(--accent-color);
        }

        .footer-bottom {
            max-width: var(--max-width);
            margin: 0 auto;
            padding-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            .hero h1 {
                font-size: 32px;
            }
            .hero-btns {
                flex-direction: column;
            }
            .footer-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .footer-bottom {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-area">
                <!-- If you upload logo.png to github, it replaces this text automatically -->
                <img src="logo.png" alt="Frontline Accountancy Experts" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
                <div id="logo-text" class="logo-fallback" style="display:none;">Frontline<span>Accountancy</span></div>
            </a>
            <nav>
                <a href="index.html">Home</a>
